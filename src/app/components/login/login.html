<div class="login-screen">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-container">
        <svg viewBox="0 0 24 24">
          <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/>
        </svg>
      </div>
      <h1 class="login-title">Welcome back</h1>
      <p class="login-subtitle">Sign in to your MedCross health portal</p>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="input-group">
        <label for="patientNumber">Patient Number</label>
        <div class="input-wrapper">
          <input
            id="patientNumber"
            type="text"
            [ngModel]="patientNumber()"
            (ngModelChange)="patientNumber.set($event); showError.set(false)"
            name="patientNumber"
            placeholder="e.g. 100234"
            autocomplete="username"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            enterkeyhint="next"
            required>
          <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            [ngModel]="password()"
            (ngModelChange)="password.set($event); showError.set(false)"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            enterkeyhint="go"
            required>
          <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
          <button type="button" class="toggle-visibility-btn" (click)="togglePasswordVisibility()" [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
            @if (showPassword()) {
              <svg viewBox="0 0 24 24"><path d="M12 6.5c3.79 0 7.17 2.13 8.82 5.5-.59 1.2-1.42 2.27-2.41 3.12l1.41 1.41c1.39-1.23 2.49-2.77 3.18-4.53C21.27 7.11 17 4 12 4c-1.27 0-2.49.2-3.64.57l1.65 1.65c.64-.11 1.29-.22 1.99-.22zM2.71 3.16L1.29 4.58l2.79 2.79C2.66 8.63 1.51 10.19.82 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l3.33 3.33 1.41-1.41L2.71 3.16zM12 17c-3.79 0-7.17-2.13-8.82-5.5.77-1.55 1.98-2.85 3.44-3.79l1.5 1.5A3.99 3.99 0 0012 15.5c.66 0 1.28-.17 1.83-.46l1.35 1.35c-.95.4-1.99.61-3.18.61zm.24-6.62l2.38 2.38.02-.24a2.5 2.5 0 00-2.16-2.16z"/></svg>
            } @else {
              <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8a3 3 0 100 6 3 3 0 000-6z"/></svg>
            }
          </button>
        </div>
        @if (showError()) {
          <div class="error-message" role="alert">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            That patient number or password doesn't match. Please try again.
          </div>
        }
      </div>
      <button type="submit" class="login-btn" [disabled]="isSubmitting() || !patientNumber().trim() || !password()">
        @if (isSubmitting()) {
          <span class="btn-spinner" aria-hidden="true"></span>
          Signing in…
        } @else {
          Sign In
        }
      </button>
    </form>

    <div class="login-footer">
      <div class="login-note">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
        <span>First time? Sign in with <strong>medcross</strong> — you can change it right after.</span>
      </div>
      <p class="login-trust">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        Your health information is private and encrypted
      </p>
    </div>
  </div>
</div>
