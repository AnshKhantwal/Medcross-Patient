<div class="app-layout">
  <!-- Sidebar (desktop / tablet) -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <div class="sidebar-logo">
          <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
        </div>
        <span class="sidebar-brand-text">MedCross</span>
      </div>
    </div>
    <nav class="sidebar-nav" aria-label="Primary">
      <p class="nav-section-title">Menu</p>
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
        <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span>Dashboard</span>
      </a>
      <a routerLink="/vitals" routerLinkActive="active" class="nav-item">
        <svg class="ico" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></svg>
        <span>Add Vitals</span>
      </a>
      <a routerLink="/tasks" routerLinkActive="active" class="nav-item">
        <svg class="ico" viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>
        <span>Daily Tasks</span>
      </a>
      <a routerLink="/history" routerLinkActive="active" class="nav-item">
        <svg class="ico" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
        <span>History</span>
      </a>
      <a routerLink="/profile" routerLinkActive="active" class="nav-item">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>
        <span>Profile</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-profile">
        <button class="user-avatar profile-menu-btn" (click)="toggleProfileMenu($event)" aria-label="Open profile menu" aria-haspopup="menu" [attr.aria-expanded]="profileMenuOpen()">
          <img [src]="avatarUrl() || 'image.png'" alt="" class="user-avatar-img">
        </button>
        <div class="user-info">
          <div class="user-name">{{ patient()?.name || 'Patient' }}</div>
          <div class="user-role">Patient</div>
        </div>
        <svg class="ico user-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>
        <div class="profile-menu" role="menu" *ngIf="profileMenuOpen()">
          <button class="profile-menu-item" role="menuitem" (click)="goToProfile()">
            <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>
            Profile
          </button>
          <button class="profile-menu-item" role="menuitem" (click)="changePassword()">
            <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            Change Password
          </button>
          <button class="profile-menu-item logout-item" role="menuitem" (click)="logout()">
            <svg class="ico" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
            Sign Out
          </button>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Mobile Header -->
    <div class="mobile-header">
      <div class="mobile-brand">
        <div class="mobile-logo">
          <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
        </div>
        <span class="mobile-title">MedCross</span>
      </div>
      <button class="mobile-avatar profile-menu-btn" (click)="toggleProfileMenu($event)" aria-label="Open profile menu" aria-haspopup="menu" [attr.aria-expanded]="profileMenuOpen()">
        <img [src]="avatarUrl() || 'image.png'" alt="" class="user-avatar-img">
      </button>
      <div class="profile-menu mobile" role="menu" *ngIf="profileMenuOpen()">
        <button class="profile-menu-item" role="menuitem" (click)="goToProfile()">
          <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>
          Profile
        </button>
        <button class="profile-menu-item" role="menuitem" (click)="changePassword()">
          <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Change Password
        </button>
        <button class="profile-menu-item logout-item" role="menuitem" (click)="logout()">
          <svg class="ico" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
          Sign Out
        </button>
      </div>
    </div>

    <!-- Router Outlet for nested content -->
    <div class="route-content">
      <router-outlet></router-outlet>
    </div>
    <app-toast></app-toast>

    <!-- Bottom Tab Bar (mobile) -->
    <nav class="bottom-tab-bar" aria-label="Primary">
      <a routerLink="/dashboard" routerLinkActive="active" class="tab-item">
        <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span>Home</span>
      </a>
      <a routerLink="/vitals" routerLinkActive="active" class="tab-item">
        <svg class="ico" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></svg>
        <span>Vitals</span>
      </a>
      <a routerLink="/tasks" routerLinkActive="active" class="tab-item">
        <svg class="ico" viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>
        <span>Tasks</span>
      </a>
      <a routerLink="/history" routerLinkActive="active" class="tab-item">
        <svg class="ico" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
        <span>History</span>
      </a>
      <a routerLink="/profile" routerLinkActive="active" class="tab-item">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>
        <span>Profile</span>
      </a>
    </nav>
  </main>
</div>
