<button type="button" class="back-link" (click)="goBack()">
  <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
  Back
</button>

<div class="profile-card">
  <h2 class="profile-title">Your profile</h2>
  <p class="profile-subtitle">Update your name, phone number, and photo.</p>

  <div class="avatar-section">
    <div class="avatar-wrapper">
      <img [src]="avatarUrl() || 'image.png'" alt="Profile photo" class="avatar-img">

      <button type="button" class="avatar-edit-btn" (click)="triggerFileInput()" aria-label="Change profile photo">
        <svg viewBox="0 0 24 24"><path d="M12 9a3.5 3.5 0 100 7 3.5 3.5 0 000-7zM9 2L7.17 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2h-3.17L15 2H9zm3 15a5 5 0 110-10 5 5 0 010 10z"/></svg>
      </button>
    </div>
    <input #fileInput type="file" accept="image/*" class="sr-only-input" (change)="onAvatarSelected($event)">
    <div class="avatar-actions">
      <button type="button" class="avatar-link-btn" (click)="triggerFileInput()">Upload photo</button>
      @if (avatarUrl()) {
        <span class="avatar-actions-sep">&middot;</span>
        <button type="button" class="avatar-link-btn danger" (click)="removeAvatar()">Remove</button>
      }
    </div>
  </div>

  <form [formGroup]="form" (ngSubmit)="saveProfile()" class="profile-form">
    <div class="form-group modern">
      <div class="input-wrapper">
        <input id="name" formControlName="name" type="text" placeholder=" " autocomplete="name" autocapitalize="words" enterkeyhint="next" required />
        <label for="name">Full Name</label>
      </div>
      <div class="error" *ngIf="form.controls.name.invalid && form.controls.name.touched">Name is required.</div>
    </div>
    <div class="form-group modern">
      <div class="input-wrapper">
        <input id="phone" formControlName="phone" type="tel" placeholder=" " autocomplete="tel" inputmode="tel" enterkeyhint="done" required />
        <label for="phone">Phone Number</label>
      </div>
      <div class="error" *ngIf="form.controls.phone.invalid && form.controls.phone.touched">Enter a valid phone number.</div>
    </div>
    <button type="submit" class="save-btn" [disabled]="form.pristine || form.invalid || saving()">
      @if (saving()) {
        <span class="btn-spinner" aria-hidden="true"></span>
        Saving…
      } @else {
        Save Changes
      }
    </button>
  </form>

  <div class="profile-divider"></div>

  <button type="button" class="security-row" (click)="goToChangePassword()">
    <span class="security-row-icon">
      <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </span>
    <span class="security-row-text">
      <strong>Change Password</strong>
      <small>Update your account password</small>
    </span>
    <svg class="security-row-chevron" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
  </button>
</div>
