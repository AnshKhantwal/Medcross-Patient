<header class="pf-hero">
  <div class="pf-avatar">
    <img [src]="avatarUrl() || 'image.png'" alt="Profile photo">
  </div>
  @if (loaded()) {
    <h1 class="pf-name">{{ user().name }}</h1>
    <span class="pf-chip">Patient · #{{ user().patientId }}</span>
  } @else {
    <span class="pf-skel pf-skel-name" aria-hidden="true"></span>
    <span class="pf-skel pf-skel-chip" aria-hidden="true"></span>
  }
</header>

<main class="pf-body">
  <section class="pf-group" aria-labelledby="pf-personal-h">
    <h2 id="pf-personal-h" class="pf-group-title">Contact</h2>
    <div class="pf-list">
      <div class="pf-row">
        <span class="pf-row-ico">
          <svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
        </span>
        <span class="pf-row-text">
          <span class="pf-row-label">Phone number</span>
          <span class="pf-row-value num">{{ user().phone || 'Not on file' }}</span>
        </span>
        <svg class="pf-lock" viewBox="0 0 24 24" aria-label="Read only"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </div>
    </div>
    <p class="pf-caption">Your name and phone number are managed by your care team. Contact MedCross support to update them.</p>
  </section>

  <section class="pf-group" aria-labelledby="pf-security-h">
    <h2 id="pf-security-h" class="pf-group-title">Security</h2>
    <div class="pf-list">
      <button type="button" class="pf-row pf-row-action" (click)="goToChangePassword()">
        <span class="pf-row-ico">
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <span class="pf-row-text">
          <span class="pf-row-value">Change password</span>
          <span class="pf-row-label">Keep your account secure</span>
        </span>
        <svg class="pf-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>
  </section>

  <section class="pf-group">
    <div class="pf-list">
      <button type="button" class="pf-row pf-row-action pf-row-danger" (click)="logout()">
        <span class="pf-row-ico">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
        </span>
        <span class="pf-row-text">
          <span class="pf-row-value">Sign out</span>
        </span>
      </button>
    </div>
  </section>
</main>
