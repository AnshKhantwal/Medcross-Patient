<button type="button" class="back-link" (click)="goBack()">
  <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
  Back
</button>

<div class="profile-card">
  <div class="change-password-icon">
    <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
  </div>
  <h2 class="change-password-title">Change Password</h2>
  <p class="profile-subtitle">Choose a new password to keep your account secure.</p>

  <form [formGroup]="form" (ngSubmit)="changePassword()" class="change-password-form">
    <div class="form-group modern">
      <div class="input-wrapper">
        <input id="currentPassword" formControlName="currentPassword" [type]="showCurrent() ? 'text' : 'password'" placeholder=" " autocomplete="current-password" autocapitalize="none" spellcheck="false" required />
        <label for="currentPassword">Current Password</label>
        <button type="button" class="toggle-visibility-btn" (click)="toggleShowCurrent()" [attr.aria-label]="showCurrent() ? 'Hide password' : 'Show password'">
          @if (showCurrent()) {
            <svg class="ico" viewBox="0 0 24 24"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><path d="m2 2 20 20"/></svg>
          } @else {
            <svg class="ico" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          }
        </button>
      </div>
      <div class="error" *ngIf="form.controls.currentPassword.invalid && form.controls.currentPassword.touched">Current password is required.</div>
    </div>
    <div class="form-group modern">
      <div class="input-wrapper">
        <input id="newPassword" formControlName="newPassword" [type]="showNew() ? 'text' : 'password'" placeholder=" " autocomplete="new-password" autocapitalize="none" spellcheck="false" required />
        <label for="newPassword">New Password</label>
        <button type="button" class="toggle-visibility-btn" (click)="toggleShowNew()" [attr.aria-label]="showNew() ? 'Hide password' : 'Show password'">
          @if (showNew()) {
            <svg class="ico" viewBox="0 0 24 24"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><path d="m2 2 20 20"/></svg>
          } @else {
            <svg class="ico" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          }
        </button>
      </div>
      <div class="error" *ngIf="form.controls.newPassword.invalid && form.controls.newPassword.touched">New password (min 8 chars) required.</div>
      <p class="field-hint" *ngIf="form.controls.newPassword.valid || !form.controls.newPassword.touched">Use at least 8 characters.</p>
    </div>
    <div class="form-group modern">
      <div class="input-wrapper">
        <input id="confirmPassword" formControlName="confirmPassword" [type]="showConfirm() ? 'text' : 'password'" placeholder=" " autocomplete="new-password" autocapitalize="none" spellcheck="false" enterkeyhint="done" required />
        <label for="confirmPassword">Confirm New Password</label>
        <button type="button" class="toggle-visibility-btn" (click)="toggleShowConfirm()" [attr.aria-label]="showConfirm() ? 'Hide password' : 'Show password'">
          @if (showConfirm()) {
            <svg class="ico" viewBox="0 0 24 24"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><path d="m2 2 20 20"/></svg>
          } @else {
            <svg class="ico" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          }
        </button>
      </div>
      <div class="error" *ngIf="form.controls.confirmPassword.invalid && form.controls.confirmPassword.touched">Please confirm your new password.</div>
      <div class="error" *ngIf="form.controls.confirmPassword.touched && !passwordsMatch()">Passwords do not match.</div>
    </div>
    <button type="submit" class="save-btn" [disabled]="!isValid() || isSubmitting()">
      @if (isSubmitting()) {
        <span class="btn-spinner" aria-hidden="true"></span>
        Updating…
      } @else {
        Change Password
      }
    </button>
  </form>
</div>
